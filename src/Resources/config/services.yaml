# Container-Services. Alles autowire/autoconfig — Symfony zieht Hooks/Commands
# über das Attribut-System (#[AsHook], #[AsCommand]) automatisch ein.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Auto-Registrierung aller Klassen unter src/. DI/Resources/Tests ausschließen.
    VenneMedia\VenneSearchContaoBundle\:
        resource: '../../../src/'
        exclude:
            - '../../../src/DependencyInjection/'
            - '../../../src/Message/'
            - '../../../src/Service/Indexer/SearchDocument.php'
            - '../../../src/Service/Search/SearchResult.php'
            - '../../../src/Service/Settings/SettingsConfig.php'
            - '../../../src/Service/Pdf/PdfExtractor.php'
            - '../../../src/Service/Platform/ResolveClient.php'
        public: false

    # ResolveClient: spricht die venne_search-Plattform an + cached das Result.
    # platform_url bleibt Default (https://venne-search.de), kann aber pro
    # Installation via DCA-Feld (Spalte platform_url) überschrieben werden —
    # dann liest SettingsRepository den Override aus der DB.
    VenneMedia\VenneSearchContaoBundle\Service\Platform\ResolveClient:
        arguments:
            $db: '@database_connection'
            $platformUrl: 'https://venne-search.de'
            $logger: '@?logger'

    # PdfExtractor + Result-Klassen sind Wert-Objekte / brauchen explizite Definition,
    # weil sie kein autowiring-Pattern matchen (oder eigene Construct-Args haben).
    VenneMedia\VenneSearchContaoBundle\Service\Pdf\PdfExtractor:
        arguments:
            $logger: '@?logger'

    # v2.2.0: PDF-Thumbnail-Generator. Wird nur aufgerufen wenn das Setting
    # `generate_pdf_thumbnails` aktiv ist. Ruft auf dem Server `gs`
    # (Ghostscript) auf, Fallback auf Imagick wenn `gs` nicht installiert.
    VenneMedia\VenneSearchContaoBundle\Service\Pdf\PdfThumbnailGenerator:
        arguments:
            $logger: '@?logger'

    # v2.2.0: Datei-Erstellungsdatum aus Metadaten lesen (PDF/DOCX/ODT/EXIF/PNG-Text).
    # Liefert Unix-Timestamp, fällt auf filectime/filemtime zurück.
    VenneMedia\VenneSearchContaoBundle\Service\Metadata\FileDateExtractor:
        arguments:
            $logger: '@?logger'

    # v2.2.0: PageTagFieldListener wird per static::render() aus dem DCA
    # aufgerufen — der Container muss den Service auflösbar halten (public),
    # sonst inlined Symfony ihn weg und ::render() crasht beim Lookup.
    VenneMedia\VenneSearchContaoBundle\EventListener\PageTagFieldListener:
        public: true

    # Selbes Pattern fuer das Tag-Uebersetzungs-Feld (dynamische Inputs pro Locale).
    VenneMedia\VenneSearchContaoBundle\EventListener\TagTranslationsFieldListener:
        public: true

    # Auto-Match-Pattern-Uebersetzungen pro Locale (englische Detail-Seiten
    # haben andere URL-Pattern als deutsche).
    VenneMedia\VenneSearchContaoBundle\EventListener\TagPatternTranslationsFieldListener:
        public: true

    # Tag-Picker im Datei-Edit-Form (tl_files), analog PageTagFieldListener.
    VenneMedia\VenneSearchContaoBundle\EventListener\FileTagFieldListener:
        public: true

    # Lupen-Toggle in der Seitenstruktur — button_callback per Service-Lookup.
    VenneMedia\VenneSearchContaoBundle\EventListener\PageSearchToggleListener:
        public: true

    # CLI-Command zum Reindexieren einer einzelnen Datei.
    VenneMedia\VenneSearchContaoBundle\Command\ReindexFileCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
        tags:
            - { name: console.command }

    # Synonym-Save-Listener wird per DCA-onsubmit/ondelete_callback als Service-ID
    # aufgerufen — Contao 4.13 ruft System::getContainer()->get(self::class), das
    # braucht public Sichtbarkeit. Sonst „ServiceNotFoundException".
    VenneMedia\VenneSearchContaoBundle\EventListener\SynonymSaveListener:
        public: true

    # Tag-Delete-Listener — ebenfalls per Service-ID aus DCA-ondelete_callback.
    VenneMedia\VenneSearchContaoBundle\EventListener\TagDeleteListener:
        public: true
        arguments:
            $projectDir: '%kernel.project_dir%'

    # v2.2.0: Crawler-Panel im DCA, gleiches Pattern wie Tag-Feld (public).
    VenneMedia\VenneSearchContaoBundle\EventListener\CrawlerPanelListener:
        public: true

    # v2.2.0: HTTP-Client für die Crawler-API auf venne-search.de.
    VenneMedia\VenneSearchContaoBundle\Service\Platform\CrawlerConfigClient:
        arguments:
            $logger: '@?logger'

    # Meilisearch-Client als Singleton — gebaut von der Factory, die das
    # Endpoint+Key aus den DCA-Settings (tl_venne_search_settings) holt.
    Meilisearch\Client:
        factory: ['@VenneMedia\VenneSearchContaoBundle\Service\MeilisearchClientFactory', 'create']

    # Public Services — werden von Contao-Hooks/Modulen direkt referenziert.
    VenneMedia\VenneSearchContaoBundle\Service\Search\SearchService:
        public: true

    VenneMedia\VenneSearchContaoBundle\Service\Indexer\DocumentIndexer:
        public: true

    VenneMedia\VenneSearchContaoBundle\Service\Settings\SettingsRepository:
        public: true

    VenneMedia\VenneSearchContaoBundle\Service\Locale\FileLocaleDetector:
        public: true

    # Controller müssen public sein, damit Symfony sie als Action invoken kann.
    VenneMedia\VenneSearchContaoBundle\Controller\FrontendSearchController:
        public: true
        tags: ['controller.service_arguments']

    VenneMedia\VenneSearchContaoBundle\Controller\Backend\IndexBrowserController:
        public: true
        tags: ['controller.service_arguments']

    VenneMedia\VenneSearchContaoBundle\Controller\Backend\ProgressController:
        public: true
        tags: ['controller.service_arguments']

    VenneMedia\VenneSearchContaoBundle\Controller\Backend\ReindexStreamController:
        public: true
        tags: ['controller.service_arguments']

    VenneMedia\VenneSearchContaoBundle\Controller\Backend\ReindexPlanController:
        public: true
        tags: ['controller.service_arguments']

    VenneMedia\VenneSearchContaoBundle\Controller\Backend\ReindexItemController:
        public: true
        tags: ['controller.service_arguments']

    VenneMedia\VenneSearchContaoBundle\Controller\Backend\ReindexFinalizeController:
        public: true
        tags: ['controller.service_arguments']

    VenneMedia\VenneSearchContaoBundle\Controller\Backend\ReindexRemoveController:
        public: true
        tags: ['controller.service_arguments']

    VenneMedia\VenneSearchContaoBundle\Controller\Backend\ReindexSingleController:
        public: true
        tags: ['controller.service_arguments']

    VenneMedia\VenneSearchContaoBundle\Controller\Backend\FileLocaleController:
        public: true
        tags: ['controller.service_arguments']

    VenneMedia\VenneSearchContaoBundle\Controller\Backend\TagAssignController:
        public: true
        tags: ['controller.service_arguments']

    VenneMedia\VenneSearchContaoBundle\Controller\Backend\TagUnassignController:
        public: true
        tags: ['controller.service_arguments']

    VenneMedia\VenneSearchContaoBundle\Controller\Backend\TagBulkAssignController:
        public: true
        tags: ['controller.service_arguments']

    VenneMedia\VenneSearchContaoBundle\Controller\Backend\TagSuggestController:
        public: true
        tags: ['controller.service_arguments']

    # Public, damit DCA-input_field_callback ihn statisch über System::getContainer()->get() holen kann.
    VenneMedia\VenneSearchContaoBundle\EventListener\BackendActionListener:
        public: true

    VenneMedia\VenneSearchContaoBundle\EventListener\TagBackendListener:
        public: true

    VenneMedia\VenneSearchContaoBundle\Service\Tag\TagRepository:
        public: true

    VenneMedia\VenneSearchContaoBundle\Service\Analytics\SearchAnalyticsBuffer:
        public: true
